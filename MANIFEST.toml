name = "LRCLIB Lyrics"
version = "2.0.0"
description = "Fetch synchronized or plain lyrics from LRCLIB, embed them in tags, and optionally save sidecar files."
api = ["3.0"]
authors = ["Glicole"]
license = "MIT"
license_url = "https://opensource.org/licenses/MIT"
homepage = "https://github.com/izaz4141/picard-lrclib"
categories = ["metadata", "ui"]
min_python_version = "3.10"
long_description = """
Fetches lyrics from LRCLIB automatically when files are loaded or saved, or manually from Picard's context menu. Requests are queued and retried with progress and completion summaries in Picard's log. Synchronized lyrics are preferred, with plain lyrics used as a fallback. Lyrics can be embedded in audio metadata and written as .lrc or .txt sidecar files.
"""
